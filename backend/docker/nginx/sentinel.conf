# Upstream FastAPI backend
upstream sentinel_api {
    server api:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect (production)
server {
    listen 80;
    server_name _;

    # Allow health check over HTTP
    location /health {
        proxy_pass http://sentinel_api;
        proxy_set_header Host $host;
    }

    # Redirect all other HTTP to HTTPS in production
    # Comment this block for development
    # return 301 https://$host$request_uri;

    # For development: proxy directly
    location / {
        proxy_pass http://sentinel_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
    }

    # Auth endpoints - stricter rate limiting
    location ~ ^/api/(v1/)?auth/(login|register) {
        proxy_pass http://sentinel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=auth_limit burst=5 nodelay;
    }

    # File uploads - size limit and upload rate limiting
    location ~ ^/api/(v1/)?complaints/.+/media {
        proxy_pass http://sentinel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 110M;
        proxy_read_timeout 600;
        limit_req zone=upload_limit burst=10 nodelay;
    }

    # Static uploads served directly by Nginx (faster than Python)
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Security: prevent script execution in uploads
        location ~* \.(php|py|sh|cgi|pl)$ {
            deny all;
        }
    }
}


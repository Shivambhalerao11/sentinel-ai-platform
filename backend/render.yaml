services:
  - type: web
    name: sentinel-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["https://sentinel-ai-platform.vercel.app","http://localhost:5173"]'
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: sentinelsecurityai@gmail.com
      - key: BREVO_SENDER_NAME
        value: Sentinel AI Platform
